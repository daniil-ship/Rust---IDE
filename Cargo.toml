[package]
name = "rust_minus_minus"
version = "2.0.0"
edition = "2021"
authors = ["Daniil"]
description = "Rust-- IDE - Maximum simplified Rust"
license = "MIT"

[dependencies]
eframe = "0.31"
rfd = "0.15"
image = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5"

[[bin]]
name = "rust_minus_minus"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
